# CI – one job per question, so a red check says what is wrong:
#   lint     ESLint without warnings, the TypeScript check and the content schema unit check. Red = a code or type
#            error, or a content rule that no longer holds (scripts/check-content.mjs).
#   samples  the ts and tsx code blocks in content/ type-check against the installed packages. Red = a sample does not
#            compile: the log names the MDX file and line (scripts/check-samples.mjs).
#   spelling cspell on the content, docs/ and README.md in US English. Red = an unknown word: fix it, or add a real
#            project word to cspell-words.txt.
#   build    the static export builds (out/) and is passed on to the checks below. Red = a page does not build.
#            Checks out the full history: the page dates come from git (scripts/page-dates.mjs).
#   a11y     axe on every page in Light and Dark at 1440 and 390 px (WCAG 2.2 AA), and every page hydrates without a
#            mismatch (tests/hydration.spec.mts). Red = an accessibility violation (the log names the rule and the
#            elements) or a hydration error (the log names the page); the Playwright report is under Summary → Artifacts.
#   keyboard the keyboard path at 1440 and 390 px: skip link, header, search, mobile menu. Red = a control is not
#            reached, does not open or close, or focus does not return: the log names the step.
#   budget   the JavaScript every page loads (gzip), as a table in the summary. Red = a page is over the limit in
#            scripts/js-budget.mjs (BUDGET_KB) or a script is missing.
#   links    every internal link and asset in the export reaches a file. Red = a broken link: the log lists page → target.
#   sitemap  sitemap.xml lists every page of the export and nothing else, and robots.txt names it. Red = the log lists
#            the missing and extra URLs (scripts/check-sitemap.mjs).
#   screenshots every template page against its reference in tests/screenshots/ (Light and Dark at 1440, Light at
#            390). Red = a page looks different, or has no reference yet: the diff is in the Playwright report. To
#            accept a change or add a page: Actions → "Update screenshots" → Run workflow → your branch; it commits
#            the references to the branch (see tests/screenshots.spec.mts).
#   lighthouse Lighthouse on mobile for one page per type, with the scores and LCP in the summary and the reports in
#            the "lighthouse" artifact. Red = accessibility, best practices or SEO below 100 on a page. Performance
#            below 95 and LCP over 2.5 s only warn until images show before hydration (the library Image).
# “Deploy” starts only when all of them passed for a push to main. The job names are the required checks of main.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # By hand, on any branch: the same checks.
  workflow_dispatch:

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:content

  samples:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:samples

  spelling:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:spelling

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: prebuild reads the last commit date of every page (scripts/page-dates.mjs).
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # The checks below test exactly this export instead of building it again.
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: out/
          if-no-files-found: error
          retention-days: 3

  a11y:
    needs: build
    # Fixed OS: Chromium relies on the libraries of this image. Raise this together with a Playwright update.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Chromium only, without apt: the runner image already has the libraries Chromium needs, and --with-deps fails
      # whenever the Ubuntu mirrors are down (it only added fonts the site does not use). Download takes seconds.
      - run: npx playwright install chromium
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: out
      - run: npm run test:a11y
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  keyboard:
    needs: build
    # Same setup as a11y (see there).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: out
      - run: npm run test:keyboard
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-keyboard
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # budget, links and sitemap only read files with Node's own modules: no npm ci needed.
  budget:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: out
      - run: npm run check:js-budget

  links:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: out
      - run: npm run check:links

  sitemap:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: out
      - run: npm run check:sitemap

  screenshots:
    needs: build
    # Same setup as a11y (see there). The references are the files of this runner image: fonts render differently on
    # other systems, so they are made here and nowhere else.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: out
      # Compares only: a page without a reference fails. References come from the workflow "Update screenshots".
      - name: Compare with the references
        run: npm run test:screenshots -- --update-snapshots=none
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-screenshots
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  lighthouse:
    needs: build
    runs-on: ubuntu-24.04
    # 9 pages × 3 runs take about 5 minutes on a fast machine.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: out
      # The runner image's Chrome, Lighthouse's mobile profile, 3 runs per page (lighthouserc.json). lhci writes the
      # reports before it checks the assertions, so the summary step runs after a failed assertion too.
      - run: npx lhci autorun
      - run: node scripts/lighthouse-summary.mjs
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse
          path: lighthouse/
          if-no-files-found: ignore
          retention-days: 14
