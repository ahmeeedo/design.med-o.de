# nginx for the docs site: serves the static export with clean URLs, the 404 page, cache rules and security headers.
# Setup: the Dockerfile copies this file to /etc/nginx/conf.d/default.conf and out/ to /usr/share/nginx/html.
# Rollback: this file ships inside the image – deploy an earlier image tag (sha-<commit>) in Coolify.
#
# Cache rules by path. Only server-level add_header is used: a location with its own add_header would drop
# all headers of the server block (nginx does not merge them).
map $uri $medo_cache_control {
    # Content-hashed Next.js files (scripts, styles, fonts, images): a new build has new file names.
    ~^/_next/static/   "public, max-age=31536000, immutable";
    # Everything else revalidates on every visit (ETag, usually a 304 without body), otherwise a deploy stays
    # invisible: HTML, the page data (.txt), unhashed files and the search index in /pagefind/. The index has files
    # whose names stay the same across builds, so the whole folder revalidates; a longer rule for its hashed parts
    # needs a look at the real file names first.
    default            "no-cache";
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header Cache-Control $medo_cache_control always;
    # HTTPS only (TLS ends at the proxy in front). No includeSubDomains: other subdomains are not ours to decide.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Nobody may frame the site.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;

    # Clean URLs: /docs/overview/introduction serves docs/overview/introduction.html (Next exports one file per page).
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # Level 6 is also what scripts/js-budget.mjs measures.
    gzip_comp_level 6;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;
}
